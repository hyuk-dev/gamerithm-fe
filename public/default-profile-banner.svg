<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bannerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#581C87;stop-opacity:0.8" />
      <stop offset="25%" style="stop-color:#7C3AED;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#1E40AF;stop-opacity:0.7" />
      <stop offset="75%" style="stop-color:#0891B2;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#06B6D4;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0.3" />
    </linearGradient>
    <pattern id="hexPattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 45 15 L 45 45 L 30 60 L 15 45 L 15 15 Z" fill="none" stroke="white" stroke-width="1" opacity="0.1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bannerGradient)"/>
  
  <!-- Pattern overlay -->
  <rect width="1200" height="300" fill="url(#hexPattern)"/>
  
  <!-- Gaming elements -->
  <g opacity="0.4">
    <!-- Controllers -->
    <g transform="translate(100, 80)">
      <rect x="0" y="0" width="40" height="25" rx="12" fill="white"/>
      <rect x="-8" y="5" width="16" height="15" rx="8" fill="white"/>
      <rect x="32" y="5" width="16" height="15" rx="8" fill="white"/>
    </g>
    
    <g transform="translate(1000, 120)">
      <rect x="0" y="0" width="40" height="25" rx="12" fill="white"/>
      <rect x="-8" y="5" width="16" height="15" rx="8" fill="white"/>
      <rect x="32" y="5" width="16" height="15" rx="8" fill="white"/>
    </g>
    
    <!-- Game icons -->
    <g transform="translate(200, 50)">
      <circle cx="0" cy="0" r="15" fill="white" opacity="0.6"/>
      <circle cx="0" cy="0" r="8" fill="none" stroke="white" stroke-width="2"/>
    </g>
    
    <g transform="translate(900, 200)">
      <rect x="-10" y="-10" width="20" height="20" rx="4" fill="white" opacity="0.5"/>
      <rect x="-5" y="-5" width="10" height="10" rx="2" fill="white"/>
    </g>
    
    <!-- Floating particles -->
    <circle cx="300" cy="80" r="3" fill="white"/>
    <circle cx="800" cy="60" r="2" fill="white"/>
    <circle cx="150" cy="200" r="4" fill="white"/>
    <circle cx="1050" cy="180" r="3" fill="white"/>
    <circle cx="400" cy="250" r="2" fill="white"/>
    <circle cx="700" cy="40" r="3" fill="white"/>
  </g>
  
  <!-- Accent lines -->
  <rect x="0" y="250" width="1200" height="2" fill="url(#accentGradient)"/>
  <rect x="0" y="280" width="1200" height="1" fill="url(#accentGradient)" opacity="0.5"/>
  
  <!-- Corner decorations -->
  <g opacity="0.2">
    <path d="M 0 0 L 50 0 L 0 50 Z" fill="white"/>
    <path d="M 1200 0 L 1150 0 L 1200 50 Z" fill="white"/>
    <path d="M 0 300 L 50 300 L 0 250 Z" fill="white"/>
    <path d="M 1200 300 L 1150 300 L 1200 250 Z" fill="white"/>
  </g>
</svg>
