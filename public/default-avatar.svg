<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="avatarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="innerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22D3EE;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#avatarGradient)"/>
  
  <!-- Inner circle for depth -->
  <circle cx="100" cy="100" r="85" fill="url(#innerGradient)" opacity="0.3"/>
  
  <!-- Gaming controller icon -->
  <g transform="translate(50, 60)">
    <!-- Controller body -->
    <rect x="20" y="30" width="60" height="40" rx="20" fill="white" opacity="0.9"/>
    
    <!-- Left grip -->
    <rect x="10" y="40" width="20" height="30" rx="10" fill="white" opacity="0.9"/>
    
    <!-- Right grip -->
    <rect x="70" y="40" width="20" height="30" rx="10" fill="white" opacity="0.9"/>
    
    <!-- D-pad -->
    <rect x="35" y="45" width="15" height="15" rx="2" fill="#1F2937"/>
    <rect x="40" y="40" width="5" height="25" rx="2" fill="#1F2937"/>
    <rect x="35" y="50" width="15" height="5" rx="2" fill="#1F2937"/>
    
    <!-- Action buttons -->
    <circle cx="60" cy="50" r="6" fill="#1F2937"/>
    <circle cx="70" cy="50" r="6" fill="#1F2937"/>
    <circle cx="65" cy="40" r="6" fill="#1F2937"/>
    <circle cx="65" cy="60" r="6" fill="#1F2937"/>
  </g>
  
  <!-- Gaming elements -->
  <circle cx="30" cy="40" r="3" fill="white" opacity="0.6"/>
  <circle cx="170" cy="60" r="2" fill="white" opacity="0.4"/>
  <circle cx="40" cy="160" r="2" fill="white" opacity="0.5"/>
  <circle cx="160" cy="140" r="3" fill="white" opacity="0.3"/>
</svg>
