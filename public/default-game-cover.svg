<svg width="400" height="225" viewBox="0 0 400 225" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gameGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E1B4B;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#312E81;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#06B6D4;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0.8" />
    </linearGradient>
    <pattern id="gridPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="white" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="225" fill="url(#gameGradient)"/>
  
  <!-- Grid pattern overlay -->
  <rect width="400" height="225" fill="url(#gridPattern)"/>
  
  <!-- Central gaming icon -->
  <g transform="translate(150, 75)">
    <!-- Game controller -->
    <rect x="20" y="30" width="60" height="40" rx="20" fill="white" opacity="0.9"/>
    <rect x="10" y="40" width="20" height="30" rx="10" fill="white" opacity="0.9"/>
    <rect x="70" y="40" width="20" height="30" rx="10" fill="white" opacity="0.9"/>
    
    <!-- Controller details -->
    <rect x="35" y="45" width="15" height="15" rx="2" fill="#1F2937"/>
    <rect x="40" y="40" width="5" height="25" rx="2" fill="#1F2937"/>
    <rect x="35" y="50" width="15" height="5" rx="2" fill="#1F2937"/>
    
    <circle cx="60" cy="50" r="6" fill="#1F2937"/>
    <circle cx="70" cy="50" r="6" fill="#1F2937"/>
    <circle cx="65" cy="40" r="6" fill="#1F2937"/>
    <circle cx="65" cy="60" r="6" fill="#1F2937"/>
  </g>
  
  <!-- Gaming elements -->
  <g opacity="0.6">
    <!-- Floating particles -->
    <circle cx="80" cy="50" r="2" fill="white"/>
    <circle cx="320" cy="70" r="3" fill="white"/>
    <circle cx="100" cy="150" r="2" fill="white"/>
    <circle cx="300" cy="140" r="2" fill="white"/>
    <circle cx="50" cy="180" r="3" fill="white"/>
    <circle cx="350" cy="160" r="2" fill="white"/>
    
    <!-- Geometric shapes -->
    <rect x="60" y="40" width="8" height="8" fill="white" opacity="0.4" transform="rotate(45 64 44)"/>
    <rect x="330" y="50" width="6" height="6" fill="white" opacity="0.5" transform="rotate(45 333 53)"/>
    <rect x="70" y="160" width="10" height="10" fill="white" opacity="0.3" transform="rotate(45 75 165)"/>
  </g>
  
  <!-- Accent line -->
  <rect x="0" y="200" width="400" height="4" fill="url(#accentGradient)"/>
  
  <!-- Corner decorations -->
  <g opacity="0.3">
    <path d="M 0 0 L 20 0 L 0 20 Z" fill="white"/>
    <path d="M 400 0 L 380 0 L 400 20 Z" fill="white"/>
    <path d="M 0 225 L 20 225 L 0 205 Z" fill="white"/>
    <path d="M 400 225 L 380 225 L 400 205 Z" fill="white"/>
  </g>
</svg>
